<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tone Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: grid; place-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .freq-box { display: flex; align-items: baseline; justify-content: center; gap: 0.25rem; font-size: 1.5rem; color: #38bdf8; }
    input[type=number] { font-size: 2.5rem; font-weight: bold; width: 4.5ch; background: none; border: none; border-bottom: 2px solid #38bdf8; color: #fff; text-align: right; outline: none; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    p { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; margin: 0.5rem 0 1.5rem; }
    .switch { position: relative; display: inline-block; width: 56px; height: 30px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #475569; transition: .2s; border-radius: 30px; }
    .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background: #fff; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background: #0284c7; }
    input:checked + .slider:before { transform: translateX(26px); }
  </style>
</head>
<body>
  <main class="card">
    <div class="freq-box">
      <input type="number" id="freq" value="260" min="1" max="20000">
      <span>Hz</span>
    </div>
    <p>Pure Sine Wave</p>
    <label class="switch" aria-label="Toggle Audio">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </main>

  <script>
    let ctx, osc, gain;
    const freq = document.getElementById('freq');

    // Toggle play/stop audio directly in the listener
    document.getElementById('toggle').onchange = (e) => {
      if (e.target.checked) {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        osc = ctx.createOscillator();
        gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = parseFloat(freq.value) || 260;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
      } else if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
      }
    };

    // Live frequency update inline
    freq.oninput = () => { if (osc) osc.frequency.value = parseFloat(freq.value) || 0; };
  </script>
</body>
</html>
