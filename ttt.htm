<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TTT</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #eee; text-align: center; margin: 0; padding: 15px; }
    canvas { background: #1a1a1a; border: 1px solid #444; cursor: crosshair; margin-top: 10px; }
    input, button { padding: 4px; margin: 4px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; vertical-align: middle; }
    input[type="color"] { width: 40px; height: 28px; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <h2>Tic-Tac-Toe Voice Room</h2>
  <input type="color" id="myColor" value="#3498db" onchange="updateID()">
  <input id="myName" value="Alice" style="width:30px" oninput="updateID()">
  <button onclick="startVoice()">🎙️ Mic On</button>
  <button onclick="loadBoard()">🔄 Sync Board</button>
  <br>
  <canvas id="cvs" width="700" height="700"></canvas>
  <div id="audios"></div>
  <script>
    const SOME_COLORS = [
      "#94a3b8", // Player 0 (slate)
      "#f87171", // Player 1 (red)
      "#60a5fa", // Player 2 (blue)
      "#34d399", // Player 3 (green)
      "#fbbf24", // Player 4 (amber)
      "#a78bfa", // Player 5 (purple)
      "#f472b6", // Player 6 (pink)
      "#fb923c", // Player 7 (orange)
      "#2dd4bf", // Player 8 (teal)
      "#e879f9"  // Player 9 (fuchsia)
    ];
    const urlParams = new URLSearchParams(window.location.search);
    const paramC = urlParams.get('c');
    let activeColor = '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0');
    if (paramC !== null) {
      if (paramC.length === 1) activeColor = SOME_COLORS[paramC] || SOME_COLORS[0];
      else                     activeColor = paramC.startsWith('#') ? paramC : '#' + paramC;
    }
    const colorInput = document.getElementById('myColor');
    colorInput.value = activeColor;

    const activeText = urlParams.get('t') ?? '';
    const nameInput = document.getElementById('myName');
    nameInput.value = activeText;
    //nameInput.value = String.fromCharCode(65 + Math.floor(Math.random() * 26));

    const N = 10, SIZE = 700, CELL = SIZE / N;
    let ID;
    function updateID() {ID = colorInput.value.slice(1) + nameInput.value.replace(/[^a-zA-Z0-9]/g, '');}
    updateID();

    const pcs = {}, dcs = {}, moves = [], ctx = cvs.getContext('2d');
    let stream, hoverCell = null;
    let forgetFailedPC = 1; // Set to > 0 to enable automatic teardown on connection failure
    window.addEventListener('beforeunload', (event) => {const hasActiveConnections = Object.keys(pcs).length > 0; if (hasActiveConnections) {event.preventDefault(); event.returnValue = '';}});

    function draw() {
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.strokeStyle = '#2d2d2d';
      ctx.lineWidth = 1;

      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const p = i * CELL;
        ctx.moveTo(p, 0); ctx.lineTo(p, SIZE);
        ctx.moveTo(0, p); ctx.lineTo(SIZE, p);
      }
      ctx.stroke();

      if (hoverCell) {
        ctx.fillStyle = '#' + ID.slice(0, 6);
        ctx.globalAlpha = 0.4;
        ctx.fillRect(hoverCell.c * CELL + 1, hoverCell.r * CELL + 1, CELL - 2, CELL - 2);
        ctx.globalAlpha = 1.0;
      }

      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      for (const [r, c, v] of moves) {
        ctx.fillStyle = '#' + v.slice(0, 6);
        ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);

        const text = v.slice(6);
        if (text) {
          ctx.fillStyle = '#fff';
          ctx.fillText(text, c * CELL + CELL / 2, r * CELL + CELL / 2, CELL - 2);
        }
      }
    }

    function recordMove(m) {
      if (!m) return;
      if (moves.some(x => x[0] === m[0] && x[1] === m[1])) m[2] += ' ERR';
      moves.push(m);
    }

    const getPos = e => {
      const r = cvs.getBoundingClientRect();
      return { c: Math.floor((e.clientX - r.left) / CELL), r: Math.floor((e.clientY - r.top) / CELL) };
    };

    cvs.onmousemove = e => { hoverCell = getPos(e); draw(); };
    cvs.onmouseleave = () => { hoverCell = null; draw(); };

    cvs.onclick = e => {
      const { r, c } = getPos(e);
      if (r < 0 || r >= N || c < 0 || c >= N || moves.some(x => x[0] === r && x[1] === c)) return;

      const move = [r, c, ID];
      recordMove(move);
      draw();

      const payload = JSON.stringify(move);
      for (const target in dcs) {if (dcs[target].readyState === 'open') dcs[target].send(payload);}      

      fetch('/cgi-bin/api.sh?task=post_move', { method: 'POST', body: payload })  //****Surprisingly, results are never cached/stale, so I am omitting { cache: 'no-store' }
        .catch(err => alert('Post Move Error: ' + err));
    };

    const loadBoard = () => fetch('/cgi-bin/api.sh?task=get_moves')
      .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
      .then(mList => { moves.length = 0; mList.forEach(recordMove); draw(); })
      .catch(err => console.warn('Load Board Error: ' + err));

    const startVoice = async () => {
      document.querySelectorAll('audio').forEach(a => {if (a.paused) a.play().catch(err => console.warn('ERROR: never seen: audio will not play (' + a.id + '): ' + err));});
      try {
        if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true }); //stream starts as null and can only be set here, so do we ever need to reload getUserMedia to get some update?  or can we just use if (!stream) to get this only once?
        let audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack || audioTrack.readyState !== 'live') {stream = await navigator.mediaDevices.getUserMedia({ audio: true }); audioTrack = stream.getAudioTracks()[0];}
        for (const target in pcs) {
          const pc = pcs[target];
          const t = pc.getTransceivers().find(tr => tr.receiver.track.kind === 'audio');
          if (t && t.sender) {
            t.direction = 'sendrecv'; //this shouldn't help since track gets added as sendrecv in initPC?
            t.sender.replaceTrack(audioTrack); //2:23 AM 8/22/2026 removed await since it should not be needed here
            //if (t.currentDirection !== 'sendrecv') { //3:29 PM 8/21/2026: this resurrection maybe is not needed any more, so trying without it
            //  pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sendSig(target, { sdp: pc.localDescription })).catch(err => console.warn('Renegotiation offer error:' + err));
            //}
          }
          else alert('ERROR: audio transceiver not yet enabled...but must be mid-negotiation?');
        }
      } catch (err) {alert('Voice/Microphone Access Error: ' + err);}};

    //eventually I will use forgetFailedPC quantity to globally manage messed up connections:
    function forgetPC(target) {if (forgetFailedPC > 0 && pcs[target]) {console.warn('[Teardown] Clearing dead connection for ' + target);
      pcs[target].close();
      delete pcs[target];
      delete dcs[target]; //dc.onclose does this redundantly, but the browser might trigger this close event with a long delay causing us to reuse the old one and then have that ripped away from us when the browser finishes
      const audioEl = document.getElementById('audio_' + target); if (audioEl) audioEl.remove();}}

    function initPC(target, isInitiator) {
      if (!target || pcs[target]) return pcs[target];
      const pc = pcs[target] = new RTCPeerConnection();
      pc.onconnectionstatechange = () => {console.error('[Conn State - ' + target + ']', pc.connectionState);
        if (pc.connectionState === 'failed') forgetPC(target);
        //if (forgetFailedPC > 0 && pc.connectionState === 'failed') { console.warn('[Teardown] Clearing dead connection for ' + target);
        //  pc.close();
        //  delete pcs[target];
        //  delete dcs[target];
        //  const audioEl = document.getElementById('audio_' + target); if (audioEl) audioEl.remove(); }
      };
      pc.oniceconnectionstatechange = () => console.error('[ICE State - ' + target + ']', pc.iceConnectionState);

      //1:58 PM 8/21/2026: moved below into isInitiator block// Pre-allocate audio channel in initial SDP (even if mic is off)
      //const audioTransceiver = pc.addTransceiver('audio', { direction: 'sendrecv' });
      //if (stream && stream.getAudioTracks()[0]) audioTransceiver.sender.replaceTrack(stream.getAudioTracks()[0]);

      pc.ontrack = e => {
        let a = document.getElementById(`audio_${target}`) || document.createElement('audio');
        a.id = `audio_${target}`; a.autoplay = true;
        if (!a.parentNode) audios.appendChild(a);
        a.srcObject = e.streams[0] || new MediaStream([e.track]);
      };
      pc.onicecandidate = e => e.candidate && sendSig(target, { candidate: e.candidate });

      const attachDC = dc => {
        dc.onmessage = e => {
          try {
            recordMove(JSON.parse(e.data));
            draw();
          } catch (err) {
            alert('DataChannel Message Error: ' + err);
          }
        };
        dc.onclose = () => delete dcs[target];
        //dc.onclose = () => { if (dcs[target] === dc) delete dcs[target]; }; //reconstructed dc is possible, but delete dcs is also done in the teardown
        dcs[target] = dc;
      };

      if (isInitiator) {
        const t = pc.addTransceiver('audio', { direction: 'sendrecv' });
        if (stream && stream.getAudioTracks()[0]) t.sender.replaceTrack(stream.getAudioTracks()[0]);
        attachDC(pc.createDataChannel('game'));
        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sendSig(target, { sdp: pc.localDescription })).catch(err => console.warn('Initial offer error:' + err));
      } else {
        pc.ondatachannel = e => attachDC(e.channel);
      }
      return pc;
    }

    const sendSig = (to, body) => fetch(`/cgi-bin/api.sh?task=send_signal&peer=${to}`, { method: 'POST', body: JSON.stringify({ from: ID, ...body }) })
      .catch(err => console.warn('Send Signal Error: ' + err));

    setInterval(async () => {
      try {
        //****sendSig(ID, { ping: true }); //DEBUG: No need to ping since server never expires anyone (and we want to minimize work for server's lighttpd since it crashes a lot...which is currently being debugged)
        const sRes = await fetch(`/cgi-bin/api.sh?task=get_signals&peer=${ID}`);
        if (sRes.ok) {
          const list = await sRes.json(); //****this gets malformed 1 in a million times (happened once when result should have been simply empty [])
          for (const s of list) {
            if (!s.from || s.from === ID) continue;
            if (s.sdp && s.sdp.type === 'offer') forgetPC(s.from); //perhaps too aggressive, so I could try the line below, but below will probably prevent the peer from resetting me
            //if (s.sdp && s.sdp.type === 'offer') {const pc_old = pcs[s.from]; if (pc_old && pc_old.connectionState === 'failed') forgetPC(s.from);}
            const pc = pcs[s.from] || initPC(s.from, false);
            if (!pc.iceQueue) pc.iceQueue = [];
            if (s.sdp) {
             try {
              await pc.setRemoteDescription(s.sdp) //.catch(err => console.warn('SDP Remote Error (sometimes seen when peer connection is already stable, but we get a queued answer from before it was stable) ' + err));
              if (s.sdp.type === 'offer') {
                const t = pc.getTransceivers().find(tr => tr.receiver.track.kind === 'audio');
                if (t && t.sender) {
                  t.direction = 'sendrecv';  //Force transceiver to negotiate sendrecv even if local mic is not yet attached
                  if (stream && stream.getAudioTracks()[0]) t.sender.replaceTrack(stream.getAudioTracks()[0]);}
                else alert('ERROR: audio transceiver somehow never got enabled by offerer');
                await pc.setLocalDescription(await pc.createAnswer()).catch(err => alert('ERROR: never seen: SDP Answer (kept catch in for debugging ****, though it now will not hit continue below): ' + err));
                sendSig(s.from, { sdp: pc.localDescription });}
             } catch (err) {console.warn('SDP handling error: ' + err); continue;}
            }
            if (pc.remoteDescription) {while (pc.iceQueue.length) {await pc.addIceCandidate(pc.iceQueue.shift()).catch(err => console.warn('ICE add error:', err));}}
            if (s.candidate) {
              //if (pc.remoteDescription && pc.remoteDescription.type) {await pc.addIceCandidate(s.candidate).catch(err => console.warn('ICE add error: ' + err));}
              if (pc.remoteDescription) {await pc.addIceCandidate(s.candidate).catch(err => console.warn('ICE add error: ' + err));}
              else pc.iceQueue.push(s.candidate);}
        }}
        //const pRes = await fetch('/cgi-bin/api.sh?task=get_peers');  //OLD METHOD: returns a string which is an array of strings like ["bob","alice","134"]
        //if (pRes.ok) {
        //  const peerList = await pRes.json();
        //  for (const target of peerList) {
        //    if (target !== ID && !pcs[target] && ID < target) initPC(target, true); }}
        const pRes = await fetch('/cgi-bin/api.sh?task=get_peers');  //NEW METHOD: returns a string which is comma-separated elements like bob,alice,134, (has ending comma; unique "empty list" response adds asterisk: *,)
        if (pRes.ok) {
          const peers = (await pRes.text()).split(','); if (peers.length < 3) console.warn('just me in peers (' + peers[0] + ')');
          const last = peers.pop(); if (last !== '') alert('ERROR: peer name (' + last + ') without trailing comma');
          for (const target of peers) {
            if (target.length < 6) alert('ERROR: peer name (' + target + ') should start with 6 color characters');
            else if (target !== ID && !pcs[target] && ID < target) initPC(target, true); }}
      } catch (err) {console.warn('Signaling Loop Error: ' + err);}}, 1500);

    draw();
    loadBoard();
  </script>
</body>
</html>
